spring.application.name=MobileMartBackend

# Server Port
server.port=${PORT:8080}

# MySQL Database Configuration (Railway / Aiven)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&requireSSL=true&serverTimezone=Asia/Kolkata
spring.jackson.time-zone=Asia/Kolkata
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Hibernate ddl-auto (update schema automatically)
# PRODUCTION NOTE: For safety against Aiven, we recommend keeping this as 'validate' in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT Secret and Expiration (1 hour = 3600000 ms)
app.jwt.secret=${JWT_SECRET_KEY}
app.jwt.expiration-ms=3600000

# Razorpay Keys
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# Spring Mail SMTP Configuration (Gmail Example)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true