spring.application.name=MobileMartBackend

# Server Port
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/mobilemartdb?useSSL=false&serverTimezone=Asia/Kolkata
spring.jackson.time-zone=Asia/Kolkata
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Hibernate ddl-auto (update schema automatically)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Secret and Expiration (1 hour = 3600000 ms)
